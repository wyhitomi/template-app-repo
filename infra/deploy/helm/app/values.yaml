# Defaults shared by every environment. Override in values-<env>.yaml.
replicaCount: 1

image:
  repository: ghcr.io/OWNER/REPO # overridden by CD (make deploy)
  tag: ""                        # overridden by CD; falls back to appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

env:
  APP_ENV: dev
  LOG_LEVEL: info

containerPort: 8080

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls: false

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
