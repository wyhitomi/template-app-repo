env:
  APP_ENV: prd
  LOG_LEVEL: warning
ingress:
  enabled: true
  host: template-app.example.com
  tls: true
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
podDisruptionBudget:
  enabled: true
  minAvailable: 2
