name: 🐛 Bug report
description: Something is broken or behaves unexpectedly.
title: "bug: "
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting! Please search existing issues first.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Call `GET /api/v1/...`
        2. With payload ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options: [local, dev, stg, prd]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / image tag
      placeholder: v1.2.3 or sha-abc123
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - S1 - outage / data loss
        - S2 - major feature broken, no workaround
        - S3 - degraded, workaround exists
        - S4 - cosmetic / minor
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs, traces, screenshots
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I removed secrets and personal data from logs/screenshots.
          required: true
