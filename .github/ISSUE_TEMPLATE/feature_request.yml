name: ✨ Feature request
description: Suggest an idea or improvement.
title: "feat: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: |
        - [ ] Given ..., when ..., then ...
  - type: dropdown
    id: rfc
    attributes:
      label: Does this need an RFC?
      description: Cross-team impact, new infrastructure, public API or data model changes -> yes.
      options: ["No", "Yes", "Not sure"]
