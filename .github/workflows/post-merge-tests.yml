# =============================================================================
# Post-merge tests - integration, e2e and performance suites.
# Runs after CI succeeds on main, against the exact image CI pushed
# (sha-<commit>), i.e. the artifact that will be promoted to stg/prd.
# A green run here is what triggers the stg deployment (see cd.yml).
# =============================================================================
name: Post-merge tests

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit SHA whose image to test (defaults to HEAD of the selected ref)
        required: false

concurrency:
  group: post-merge-${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  suites:
    name: ${{ matrix.suite }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        suite: [integration, e2e, perf]
    env:
      SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}

      - uses: ./.github/actions/setup-tools
        with:
          python: "true"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start stack from the CI-built image
        run: |
          export IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${SHA}"
          echo "Testing ${IMAGE}"
          make up UP_FLAGS="--no-build --pull always"

      - name: Run ${{ matrix.suite }} suite
        run: make test-${{ matrix.suite }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.suite }}-reports
          path: reports/
          if-no-files-found: ignore

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: make down
