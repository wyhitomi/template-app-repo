# =============================================================================
# CI - runs on every PR (opened/updated) and on every merge to main.
#   pre-commit -> test + build -> build-push (container) -> ci-ok (gate)
# Mark "ci-ok" as the single required status check in branch protection.
# =============================================================================
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          python: "true"
          iac: "true"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - name: Run hooks
        env:
          SKIP: no-commit-to-branch # CI runs on main after merge
        run: make lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          python: "true"
      - run: make test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-tools
        with:
          python: "true"
      - run: make build

  build-push:
    name: build-push
    needs: [pre-commit, test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image name and push policy
        id: meta
        env:
          # Fork PRs get a read-only token: build only, never push.
          CAN_PUSH: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          # On PRs tag with the head commit (what CD sees), not the merge ref.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          {
            echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}"
            echo "push=${CAN_PUSH}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

      - id: tags
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.meta.outputs.image }}
          # sha-<full sha> is the immutable tag CD deploys and promotes.
          tags: |
            type=raw,value=sha-${{ steps.meta.outputs.sha }}
            type=ref,event=pr
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: app/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.sha }}
            GIT_SHA=${{ steps.meta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Vulnerability scan
        if: steps.meta.outputs.push == 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  # Single required check for branch protection.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [pre-commit, test, build, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: All CI jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
