# Cloud authentication via OIDC (no long-lived keys).
# AWS is the reference implementation; swap the steps for
# google-github-actions/auth or azure/login to target another cloud.
name: Cloud auth
description: Authenticate to the cloud provider with OIDC and optionally fetch cluster credentials.
inputs:
  role-to-assume:
    description: IAM role ARN trusted for this repository/environment
    required: true
  region:
    description: Cloud region
    required: true
  cluster-name:
    description: Kubernetes cluster name (leave empty to skip kubeconfig)
    default: ""
runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role-to-assume }}
        aws-region: ${{ inputs.region }}
        role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}

    - if: inputs.cluster-name != ''
      name: Configure kubeconfig
      shell: bash
      env:
        CLUSTER: ${{ inputs.cluster-name }}
        REGION: ${{ inputs.region }}
      run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"
