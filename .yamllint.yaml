extends: default
ignore: |
  infra/deploy/helm/**/templates/
rules:
  line-length: disable
  document-start: disable
  truthy:
    allowed-values: ["true", "false", "on"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: disable
  braces:
    max-spaces-inside: 1
  indentation:
    indent-sequences: consistent
